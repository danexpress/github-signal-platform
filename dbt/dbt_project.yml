name: 'github_signal'
version: '1.0.0'
config-version: 2

profile: 'github_signal'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

on-run-start:
  - "{{ bootstrap_duckdb() }}"

models:
  github_signal:
    silver:
      +materialized: external     # dbt-duckdb writes Parquet to disk/S3
      +format: parquet